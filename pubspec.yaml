name: stridecare
description: An offline-first physiotherapy recovery companion for a smart cane.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_riverpod: ^3.5.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  fl_chart: ^1.3.1
  google_fonts: ^9.0.0
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_local_notifications: ^23.0.3
  flutter_reactive_ble: ^5.6.0
  timezone: ^0.11.2
  intl: any
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0

dev_dependencies:
  flutter_web_plugins:
    sdk: flutter
  firebase_core_web: ^4.2.0
  firebase_auth_web: ^6.4.0
  cloud_firestore_web: ^5.9.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/Fraunces-OFL.txt
    - assets/fonts/NunitoSans-OFL.txt
    - assets/fonts/NotoSansDevanagari-OFL.txt
    - assets/fonts/NotoSansGurmukhi-OFL.txt
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    - family: Noto Sans Gurmukhi
      fonts:
        - asset: assets/fonts/NotoSansGurmukhi.ttf
