ze="2.9" text-anchor="start">5. Trim the fold lines at B and D between heights 15 and 55.</text><text x="135" y="187.5" fill="#172536" font-family="Arial, sans-serif" font-size="2.9" text-anchor="start">The two openings straddle B and D; their interiors are removed.</text><text x="135" y="194.0" fill="#172536" font-family="Arial, sans-serif" font-size="2.9" text-anchor="start">True developed width = 40 / cos 45° = 56.5685 mm.</text><text x="135" y="200.5" fill="#172536" font-family="Arial, sans-serif" font-size="2.9" text-anchor="start">Unfolded opening: (x − xc)² / 800 + (y − 35)² / 400 = 1.</text></svg>